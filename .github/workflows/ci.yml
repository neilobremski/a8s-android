name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pii-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for PII in diff
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: python .github/pii_check.py
      - name: PII check unit tests
        run: pip install pytest && python -m pytest tests/test_pii.py -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew --no-daemon detekt --stacktrace

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug -PgithubRepo=${{ github.repository }} --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a8s-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
